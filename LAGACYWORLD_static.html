<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#050505">
<title>LAGACYWORLD — LAGACY ADMIN CONSOLE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:#eee;font-family:Arial,Helvetica,sans-serif}body{min-height:100vh;background:radial-gradient(ellipse at 50% 42%,#171717 0,#090909 42%,#020202 78%);display:flex;justify-content:center}.screen{width:min(100%,520px);min-height:100vh;padding:clamp(18px,5vw,30px) 16px 42px;display:flex;flex-direction:column;align-items:center}.hero{height:42vh;min-height:290px;max-height:480px;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:38px;text-align:center}.wordmark{font-size:clamp(29px,8vw,43px);font-weight:800;letter-spacing:.19em;white-space:nowrap;color:#e8e8e8;text-shadow:0 0 9px #fff8,0 0 24px #fff5}.byline{font-size:clamp(13px,4vw,17px);font-weight:600;margin-top:17px;color:#f4f4f4}.panel{width:100%;min-height:340px;border:1px solid #242424;border-radius:28px;background:linear-gradient(145deg,#111 0%,#0d0d0d 100%);padding:25px 22px 24px;box-shadow:0 12px 40px #0008}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:17px;font-weight:700}.heading{display:flex;align-items:center;gap:11px}.wifi{font-size:21px;color:#888}.count{font-size:12px;font-weight:500;color:#777;background:#1c1c1c;border-radius:30px;padding:8px 13px;white-space:nowrap}.empty{height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#777;font-size:15px;gap:12px}.empty-icon{font-size:37px;color:#444}.new-account{width:100%;height:60px;border:1px dashed #292929;border-radius:22px;background:transparent;color:#777;font-size:17px;display:flex;align-items:center;justify-content:center;gap:12px}.new-account .plus{font-size:25px;font-weight:300;color:#777}.footer{margin-top:32px;text-align:center;letter-spacing:.2em;font-size:13px;color:#ddd;text-shadow:0 0 10px #fff4}.note{margin-top:26px;color:#555;font-size:10px;text-align:center;line-height:1.6;max-width:390px}@media(max-width:360px){.panel{padding:20px 16px}.panel-head{font-size:15px}.wordmark{letter-spacing:.13em}}
</style></head><body><main class="screen"><header class="hero"><div class="wordmark">LAGACYWORLD</div><div class="byline">MADE BY LAGACY</div></header><section class="panel" aria-label="Saved accounts demo"><div class="panel-head"><div class="heading"><span class="wifi" aria-hidden="true">◉</span><span>Saved Accounts</span></div><span class="count">0 accounts</span></div><div class="empty"><div class="empty-icon" aria-hidden="true">◉</div><div>No saved accounts</div></div><button class="new-account" type="button" aria-label="New Account demo"><span class="plus">＋</span>New Account</button></section><footer class="footer">LAGACY ADMIN CONSOLE</footer><p class="note">Static visual demo only. It does not import, connect to, test, or store accounts, OTPs, messages, or device data.</p></main></body></html>
